# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.hrtq.grandcraft

# Dependencies
fabric_api_version=0.156.0+26.2

# GeckoLib — Bedrock-format models and animations, so mobs can be authored in
# Blockbench and exported straight in.
#
# This is a Modrinth VERSION ID, not a version number, and that is deliberate:
# GeckoLib publishes fabric, forge and neoforge builds all numbered 5.5.3, so
# "maven.modrinth:geckolib:5.5.3" is ambiguous and can resolve to the NeoForge
# jar. The ID below is unique to the Fabric 26.2 build of 5.5.3 (2026-06-27).
#
# To update: https://modrinth.com/mod/geckolib/versions -> pick the Fabric 26.2
# release -> the ID is the last path segment of its download URL.
geckolib_version=L6bn4TS8
